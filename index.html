<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Web 桌面</title>
  <style>
    :root {
      --text: #20232b;
      --muted: #6b7280;
      --panel: rgba(248, 249, 253, .95);
      --taskbar: rgba(241, 243, 249, .84);
      --window-bg: #f7f8fb;
      --content-bg: #fff;
      --accent: #527df3;
      --line: rgba(110, 120, 140, .18);
      --shadow: 0 18px 60px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    body {
      color: var(--text);
      background:
        radial-gradient(ellipse at 68% 48%, #4da6ff 0%, transparent 30%),
        radial-gradient(ellipse at 54% 50%, #6470ff 0%, transparent 33%),
        radial-gradient(ellipse at 30% 64%, #414dd1 0%, transparent 34%),
        linear-gradient(135deg, #123f86, #171b58 55%, #071326);
    }

    body.dark {
      --text: #f1f3f8;
      --muted: #b6bece;
      --panel: rgba(32, 36, 48, .96);
      --taskbar: rgba(25, 29, 39, .9);
      --window-bg: #242833;
      --content-bg: #1d2028;
      --line: rgba(255,255,255,.13);
      --shadow: 0 18px 60px rgba(0,0,0,.5);
    }

    body.wall-purple {
      background:
        radial-gradient(ellipse at 68% 48%, #f7a4ff 0%, transparent 30%),
        radial-gradient(ellipse at 54% 50%, #8878f5 0%, transparent 34%),
        radial-gradient(ellipse at 30% 64%, #552ca6 0%, transparent 35%),
        linear-gradient(135deg, #542a8e, #211c5c 55%, #110c2d);
    }

    body.wall-green {
      background:
        radial-gradient(ellipse at 68% 48%, #98f3b2 0%, transparent 30%),
        radial-gradient(ellipse at 54% 50%, #51c7a6 0%, transparent 34%),
        radial-gradient(ellipse at 30% 64%, #247e88 0%, transparent 35%),
        linear-gradient(135deg, #145d63, #143749 55%, #071d2b);
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .hidden { display: none !important; }

    .desktop {
      position: absolute;
      inset: 0 0 48px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 5px;
      overflow: auto;
    }

    .desktop-icon {
      width: 88px;
      min-height: 82px;
      padding: 7px 4px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 3px #000;
      font-size: 12px;
      cursor: default;
      user-select: none;
      overflow-wrap: anywhere;
    }

    .desktop-icon:hover, .desktop-icon.selected {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.2);
    }

    .desktop-icon .icon {
      display: block;
      margin-bottom: 5px;
      font-size: 32px;
      line-height: 38px;
    }

    .taskbar {
      position: fixed;
      z-index: 5000;
      inset: auto 0 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--taskbar);
      border-top: 1px solid rgba(255,255,255,.4);
      backdrop-filter: blur(24px);
      color: var(--text);
    }

    .taskbar-center {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .task-button {
      position: relative;
      width: 42px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
    }

    .task-button:hover, .task-button.active {
      background: rgba(128,140,165,.18);
    }

    .task-button.open::after {
      content: "";
      position: absolute;
      bottom: 1px;
      left: 16px;
      width: 10px;
      height: 3px;
      border-radius: 4px;
      background: var(--accent);
    }

    .win-logo {
      width: 21px;
      height: 21px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      transform: skewY(-5deg);
    }

    .win-logo i { background: #1684f8; }

    .task-search {
      width: 175px;
      height: 33px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--text);
      background: rgba(255,255,255,.58);
      cursor: text;
      font-size: 12px;
    }

    body.dark .task-search { background: rgba(255,255,255,.1); }

    .task-search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: inherit;
      background: transparent;
    }

    .tray {
      position: absolute;
      right: 8px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .tray button {
      min-width: 35px;
      height: 38px;
      padding: 0 6px;
      border: 0;
      border-radius: 5px;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }

    .tray button:hover { background: rgba(128,140,165,.18); }
    .clock { min-width: 76px; text-align: center; font-size: 11px; line-height: 1.35; }

    .panel, .context-menu {
      display: none;
      position: fixed;
      z-index: 4500;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(25px);
    }

    .panel.show, .context-menu.show { display: block; }

    .start-menu {
      left: 50%;
      bottom: 57px;
      transform: translateX(-50%);
      width: min(570px, calc(100vw - 16px));
      max-height: calc(100vh - 65px);
      overflow: auto;
      padding: 20px 24px 16px;
    }

    .start-search {
      width: 100%;
      height: 39px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-bottom: 2px solid var(--accent);
      border-radius: 5px;
      outline: 0;
      color: var(--text);
      background: rgba(255,255,255,.5);
    }

    body.dark .start-search { background: rgba(255,255,255,.1); }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 2px 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .heading button, .small-button {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: inherit;
      background: rgba(128,140,165,.1);
      cursor: pointer;
      font-size: 11px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
    }

    .app-item {
      min-height: 78px;
      padding: 8px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 6px;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }

    .app-item:hover { background: rgba(128,140,165,.16); }
    .app-item .icon { font-size: 27px; }

    .start-footer {
      margin: 18px -24px -16px;
      padding: 11px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(128,140,165,.1);
      font-size: 12px;
    }

    .user { display: flex; align-items: center; gap: 9px; }

    .avatar {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg,#80b8ff,#526ee7);
    }

    .quick-panel, .notifications {
      right: 10px;
      bottom: 57px;
      width: min(335px, calc(100vw - 16px));
      padding: 15px;
    }

    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .quick-tile {
      min-height: 48px;
      padding: 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 6px;
      color: inherit;
      background: rgba(128,140,165,.15);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }

    .quick-tile.on { color: white; background: #5578df; }
    .slider-row { margin-top: 14px; display: flex; align-items: center; gap: 9px; }
    .slider-row input { width: 100%; accent-color: var(--accent); }

    .notification {
      margin-top: 10px;
      padding: 12px;
      border-radius: 6px;
      background: rgba(128,140,165,.13);
      font-size: 12px;
      line-height: 1.55;
    }

    .window {
      position: absolute;
      z-index: 100;
      top: 80px;
      left: 50%;
      width: min(820px, calc(100vw - 24px));
      height: min(550px, calc(100vh - 100px));
      display: none;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 8px;
      color: var(--text);
      background: var(--window-bg);
      box-shadow: var(--shadow);
      transform: translateX(-50%);
    }

    .window.show { display: flex; }
    .window.minimized { display: none; }

    .window.maximized {
      inset: 5px 5px 53px !important;
      width: auto !important;
      height: auto !important;
      transform: none !important;
    }

    .window.focused {
      border-color: rgba(82,125,243,.55);
      box-shadow: 0 22px 70px rgba(0,0,0,.34);
    }

    .titlebar {
      height: 38px;
      min-height: 38px;
      padding-left: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--window-bg);
      cursor: move;
      touch-action: none;
      user-select: none;
    }

    .window-title { display: flex; gap: 8px; align-items: center; font-size: 12px; }
    .window-controls { height: 100%; display: flex; }

    .window-controls button {
      width: 43px;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }

    .window-controls button:hover { background: rgba(128,140,165,.18); }
    .window-controls .close:hover { color: white; background: #c42b1c; }
    .window-content { flex: 1; min-height: 0; overflow: auto; background: var(--content-bg); }

    .toolbar {
      min-height: 43px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--line);
    }

    .tool {
      min-width: 32px;
      height: 30px;
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }

    .tool:hover { background: rgba(128,140,165,.17); }

    .address {
      flex: 1;
      min-width: 70px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      background: rgba(128,140,165,.07);
      font-size: 12px;
    }

    .explorer-layout { height: calc(100% - 43px); display: flex; }

    .sidebar {
      width: 165px;
      flex: 0 0 165px;
      padding: 10px 7px;
      border-right: 1px solid var(--line);
    }

    .nav-item {
      padding: 9px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .nav-item:hover, .nav-item.selected { background: rgba(128,140,165,.15); }
    .files-area { flex: 1; padding: 18px; overflow: auto; }
    .files-heading { margin: 0 0 15px; font-size: 18px; font-weight: 500; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(105px,1fr)); gap: 8px; }

    .file-item {
      min-height: 85px;
      padding: 10px 5px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 5px;
      text-align: center;
      cursor: default;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .file-item:hover, .file-item.selected {
      border-color: rgba(82,125,243,.35);
      background: rgba(82,125,243,.09);
    }

    .file-item .icon { display: block; margin-bottom: 6px; font-size: 30px; }
    .empty { color: var(--muted); font-size: 13px; }

    .notepad-wrap { height: 100%; display: flex; flex-direction: column; }
    .notepad-menu { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }

    .notepad-text {
      flex: 1;
      width: 100%;
      padding: 14px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--text);
      background: var(--content-bg);
      font: 14px/1.6 Consolas, monospace;
    }

    .settings { max-width: 680px; padding: 26px; }
    .settings h2 { font-weight: 500; }

    .setting-card {
      margin: 12px 0;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(128,140,165,.06);
      font-size: 13px;
    }

    .setting-card p { color: var(--muted); font-size: 12px; }

    .setting-card button {
      margin: 3px;
      padding: 8px 11px;
      border: 0;
      border-radius: 5px;
      color: inherit;
      background: rgba(82,125,243,.16);
      cursor: pointer;
    }

    .calc { width: min(340px,100%); margin: 18px auto; padding: 10px; }
    .calc-display {
      width: 100%;
      height: 75px;
      padding: 10px;
      border: 0;
      outline: 0;
      color: inherit;
      background: transparent;
      text-align: right;
      font-size: 34px;
    }

    .calc-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; }

    .calc-key {
      height: 50px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: inherit;
      background: rgba(128,140,165,.1);
      cursor: pointer;
    }

    .calc-key:hover { background: rgba(128,140,165,.23); }
    .calc-key.equals { color: white; background: var(--accent); }

    .browser-wrap { height: 100%; display: flex; flex-direction: column; }

    .browser-bookmarks {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }

    .bm-card {
      min-width: 0;
      padding: 9px 4px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: inherit;
      background: rgba(128,140,165,.08);
      cursor: pointer;
      font-size: 11px;
      text-align: center;
    }

    .bm-card:hover { background: rgba(82,125,243,.16); border-color: rgba(82,125,243,.45); }
    .bm-icon { font-size: 22px; }
    .bm-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .browser-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }

    .browser-tip {
      padding: 4px 10px;
      color: var(--muted);
      font-size: 11px;
      border-top: 1px solid var(--line);
    }

    .terminal {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0c0c14;
      color: #d6e2ff;
      font: 13px/1.6 Consolas, "Courier New", monospace;
    }

    .term-output {
      flex: 1;
      overflow: auto;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    .term-row { display: flex; gap: 8px; padding: 0 14px 12px; }
    .term-prompt { color: #7ecbff; white-space: nowrap; }

    .term-input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: #d6e2ff;
      font: inherit;
    }

    .paint-wrap { height: 100%; display: flex; flex-direction: column; }

    .paint-canvas-area {
      flex: 1;
      overflow: auto;
      display: grid;
      place-items: center;
      background: #e8ebf2;
    }

    .paint-canvas {
      max-width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      cursor: crosshair;
      touch-action: none;
    }

    .paint-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .paint-controls label { font-size: 12px; display: flex; align-items: center; gap: 5px; }

    .paint-controls input[type="color"] {
      width: 32px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
    }

    .mine-wrap { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .mine-status { font-size: 13px; display: flex; gap: 16px; align-items: center; }

    .mine-grid {
      display: grid;
      grid-template-columns: repeat(9, 30px);
      gap: 2px;
    }

    .mine-cell {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(128,140,165,.14);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
    }

    .mine-cell:hover { background: rgba(82,125,243,.18); }
    .mine-cell.open { background: rgba(128,140,165,.05); cursor: default; }
    .mine-cell.boom { background: #e8564d; color: #fff; }
    .mine-n1 { color: #2f6fd0; } .mine-n2 { color: #2e8b47; }
    .mine-n3 { color: #d0483e; } .mine-n4 { color: #6a3bbd; }
    .mine-n5 { color: #a8642a; } .mine-n6 { color: #1d8f8f; }
    .mine-n7 { color: #444; } .mine-n8 { color: #888; }

    .taskmgr { padding: 14px; }
    .taskmgr table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .taskmgr th, .taskmgr td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
    .taskmgr tr[data-task-app] { cursor: pointer; }
    .taskmgr tr.selected { background: rgba(82,125,243,.12); }
    .taskmgr-actions { margin-top: 12px; display: flex; gap: 8px; }

    .calendar { max-width: 420px; margin: 18px auto; padding: 10px; }
    .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 12px; }
    .cal-grid .cal-wd { color: var(--muted); padding: 5px 0; font-weight: 600; }
    .cal-day { padding: 9px 0; border-radius: 6px; }
    .cal-day.today { color: #fff; background: var(--accent); font-weight: 600; }
    .cal-day.dim { color: var(--muted); opacity: .55; }

    .media { max-width: 460px; margin: 16px auto; padding: 12px; }
    .media-now {
      padding: 26px 16px;
      border-radius: 10px;
      text-align: center;
      background: linear-gradient(135deg, rgba(82,125,243,.25), rgba(130,90,240,.2));
      margin-bottom: 12px;
    }

    .media-now .disc { font-size: 44px; display: inline-block; }
    .media-now.playing .disc { animation: spin 3.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .media-track {
      width: 100%;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      border: 0;
      border-radius: 6px;
      background: rgba(128,140,165,.1);
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 5px;
      text-align: left;
    }

    .media-track:hover { background: rgba(82,125,243,.16); }

    .photo-view { height: 100%; display: grid; place-items: center; padding: 16px; }
    .photo-view img { max-width: 100%; max-height: 100%; border: 1px solid var(--line); border-radius: 6px; }

    .context-menu { width: 210px; padding: 5px; z-index: 7000; }

    .context-menu button {
      width: 100%;
      padding: 8px 9px;
      display: block;
      border: 0;
      border-radius: 4px;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
    }

    .context-menu button:hover { background: rgba(128,140,165,.17); }
    .separator { height: 1px; margin: 4px; background: var(--line); }

    .toast {
      position: fixed;
      z-index: 8000;
      right: 16px;
      bottom: 58px;
      max-width: min(350px, calc(100vw - 32px));
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: var(--panel);
      box-shadow: var(--shadow);
      font-size: 12px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: .2s;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
      .task-search { width: 38px; justify-content: center; padding: 0; }
      .task-search input { display: none; }
      .taskbar-center { transform: translateX(-18px); }
      .app-grid { grid-template-columns: repeat(4,1fr); }
      .sidebar { width: 120px; flex-basis: 120px; }
      .browser-bookmarks { grid-template-columns: repeat(2,1fr); }
      .mine-grid { grid-template-columns: repeat(9,24px); }
      .mine-cell { width: 24px; height: 24px; font-size: 12px; }
    }

    @media (max-width: 390px) {
      .app-grid { grid-template-columns: repeat(3,1fr); }
      .task-button { width: 36px; }
      .taskbar-center { gap: 0; }
      .sidebar { width: 98px; flex-basis: 98px; }
    }
  </style>
</head>
<body>
  <main class="desktop" id="desktop" aria-label="桌面"></main>

  <section class="panel start-menu" id="startMenu">
    <input class="start-search" id="startSearch" placeholder="搜索应用和文件" autocomplete="off">
    <div class="heading"><span>已固定</span><button id="allApps" type="button">所有应用</button></div>
    <div class="app-grid" id="appGrid"></div>
    <div class="start-footer">
      <div class="user"><span class="avatar">👤</span><span>用户</span></div>
      <button class="small-button" id="powerButton" type="button">🔒 关机</button>
    </div>
  </section>

  <section class="panel quick-panel" id="quickPanel">
    <div class="quick-grid">
      <button class="quick-tile on" type="button">📶 Wi‑Fi</button>
      <button class="quick-tile on" type="button">🔵 蓝牙</button>
      <button class="quick-tile" type="button">🌙 勿扰模式</button>
      <button class="quick-tile on" type="button">🔆 夜灯模式</button>
    </div>
    <div class="slider-row">💡 <input type="range" min="20" max="100" value="80"></div>
    <div class="slider-row">🔊 <input type="range" min="0" max="100" value="65"></div>
  </section>

  <section class="panel notifications" id="notifications">
    <div class="heading" style="margin-top:0">
      <span>通知</span>
      <button id="clearNotifications" type="button">清除全部</button>
    </div>
    <div class="notification" id="notificationCard">
      <b>ℹ️ 欢迎使用 Windows Web</b><br>
      文件保存在浏览器本地存储中。
    </div>
  </section>

  <div class="context-menu" id="contextMenu"></div>
  <div class="toast" id="toast" role="status"></div>

  <footer class="taskbar">
    <div class="taskbar-center">
      <button class="task-button" id="startButton" title="打开开始菜单" type="button">
        <span class="win-logo"><i></i><i></i><i></i><i></i></span>
      </button>
      <label class="task-search" id="taskSearch">🔍 <input id="taskSearchInput" placeholder="搜索"></label>
      <button class="task-button" data-launch="explorer" title="文件资源管理器" type="button">📂</button>
      <button class="task-button" data-launch="browser" title="浏览器" type="button">🌐</button>
      <button class="task-button" data-launch="notepad" title="记事本" type="button">📄</button>
      <button class="task-button" data-launch="calculator" title="计算器" type="button">🧮</button>
      <button class="task-button" data-launch="minesweeper" title="扫雷" type="button">💣</button>
    </div>
    <div class="tray">
      <button id="quickButton" title="快速设置" type="button">⚙ 📶 🔊</button>
      <button class="clock" id="clockButton" title="通知和日期" type="button">
        <div id="clockTime"></div><div id="clockDate"></div>
      </button>
    </div>
  </footer>

<script>
(() => {
  "use strict";

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  const FS_KEY = "web-windows-fs-v3";
  const TRASH_KEY = "web-windows-trash-v3";
  const DARK_KEY = "web-windows-dark-v3";
  const WALL_KEY = "web-windows-wallpaper-v3";

  const apps = {
    explorer: { title: "文件资源管理器", icon: "📂" },
    browser: { title: "浏览器", icon: "🌐" },
    notepad: { title: "记事本", icon: "📄" },
    calculator: { title: "计算器", icon: "🧮" },
    paint: { title: "画图", icon: "🎨" },
    terminal: { title: "终端", icon: "⌨️" },
    minesweeper: { title: "扫雷", icon: "💣" },
    calendar: { title: "日历", icon: "📅" },
    media: { title: "音乐播放器", icon: "🎵" },
    taskmgr: { title: "任务管理器", icon: "📊" },
    settings: { title: "设置", icon: "⚙️" },
    trash: { title: "回收站", icon: "🗑️" },
    photos: { title: "照片查看器", icon: "🖼️" },
    about: { title: "关于 Windows Web", icon: "ℹ️" }
  };

  const bookmarks = [
    { icon: "🚪", name: "后室游戏", url: "https://soolinejiang.github.io/backroom/" },
    { icon: "🏫", name: "班级网站", url: "http://soolinesauce.dpdns.org/" },
    { icon: "⛅", name: "天气预报", url: "https://soolinejiang.github.io/tqyb/" },
    { icon: "🌟", name: "soolineの个人站", url: "https://cnman.gt.tc" }
  ];

  const windows = new Map();
  let fs = loadJSON(FS_KEY, null);
  let trash = loadJSON(TRASH_KEY, []);
  let clipboard = null;
  let zIndex = 100;
  let toastTimer = null;
  let contextState = null;

  function makeId() {
    return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function makeFolder(name, children = []) {
    return { id: makeId(), name, type: "folder", children };
  }

  function makeFile(name, content = "") {
    return { id: makeId(), name, type: "file", content };
  }

  function initialFS() {
    return makeFolder("此电脑", [
      makeFolder("桌面", [
        makeFolder("新建文件夹"),
        makeFile("欢迎使用.txt", "欢迎使用 Windows Web 桌面！\n\n你可以在桌面新建文件和文件夹。\n试试浏览器、画图、终端和扫雷吧。")
      ]),
      makeFolder("文档", [
        makeFile("说明.txt", "这是 Windows Web 桌面的文档目录。")
      ]),
      makeFolder("下载"),
      makeFolder("图片"),
      makeFolder("音乐"),
      makeFolder("视频"),
      makeFolder("本地磁盘 (C:)"),
      makeFolder("本地磁盘 (D:)")
    ]);
  }

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  if (!fs || fs.type !== "folder" || !Array.isArray(fs.children)) fs = initialFS();
  if (!Array.isArray(trash)) trash = [];

  function save() {
    try {
      localStorage.setItem(FS_KEY, JSON.stringify(fs));
      localStorage.setItem(TRASH_KEY, JSON.stringify(trash));
    } catch {
      notify("本地存储空间不足，无法保存更改");
    }
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  function findNode(nodeId, node = fs) {
    if (!node) return null;
    if (node.id === nodeId) return node;
    if (node.type !== "folder") return null;

    for (const child of node.children || []) {
      const found = findNode(nodeId, child);
      if (found) return found;
    }
    return null;
  }

  function findParent(nodeId, node = fs) {
    if (!node || node.type !== "folder") return null;

    for (const child of node.children || []) {
      if (child.id === nodeId) return node;
      const found = findParent(nodeId, child);
      if (found) return found;
    }
    return null;
  }

  function desktopFolder() {
    return fs.children.find(item => item.name === "桌面" && item.type === "folder") || fs;
  }

  function fileIcon(node) {
    if (node.type === "folder") return "📁";
    if (/\.(png|jpe?g|gif|webp|bmp)$/i.test(node.name)) return "🖼️";
    if (/\.txt$/i.test(node.name)) return "📄";
    return "📃";
  }

  function notify(message) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
  }

  function closePanels() {
    $$(".panel").forEach(panel => panel.classList.remove("show"));
    $("#contextMenu").classList.remove("show");
  }

  function renderDesktop() {
    const desktop = $("#desktop");
    const items = desktopFolder().children;

    desktop.innerHTML = `
      <div class="desktop-icon" data-app="explorer"><span class="icon">📂</span>此电脑</div>
      ${Object.entries(apps).filter(([name]) => name !== "explorer" && name !== "trash").map(([name, app]) => `
        <div class="desktop-icon" data-app="${escapeHTML(name)}">
          <span class="icon">${app.icon}</span>${escapeHTML(app.title)}
        </div>`).join("")}
      <div class="desktop-icon" data-app="trash">
        <span class="icon">${trash.length ? "🗑️" : "🗳️"}</span>回收站
      </div>
      ${items.map(item => `
        <div class="desktop-icon" data-node="${escapeHTML(item.id)}">
          <span class="icon">${fileIcon(item)}</span>${escapeHTML(item.name)}
        </div>`).join("")}`;
  }

  function renderAppGrid() {
    $("#appGrid").innerHTML = Object.entries(apps).map(([name, app]) => `
      <button class="app-item" data-app="${escapeHTML(name)}" data-name="${escapeHTML(app.title)}" type="button">
        <span class="icon">${app.icon}</span><span>${escapeHTML(app.title)}</span>
      </button>`).join("");
  }

  function updateTaskbar() {
    $$("[data-launch]").forEach(button => {
      const win = windows.get(button.dataset.launch);
      button.classList.toggle("open", Boolean(win));
      button.classList.toggle("active", Boolean(win && !win.classList.contains("minimized")));
    });
  }

  function focusWindow(win) {
    $$(".window").forEach(item => item.classList.remove("focused"));
    win.classList.add("focused");
    win.style.zIndex = String(++zIndex);
    updateTaskbar();
  }

  function makeWindow(appName) {
    const app = apps[appName];
    const win = document.createElement("section");
    win.className = "window show";
    win.dataset.app = appName;
    win.style.top = `${65 + windows.size * 18}px`;
    win.style.left = `calc(50% + ${Math.min(windows.size * 14, 70)}px)`;
    win.style.zIndex = String(++zIndex);

    win.innerHTML = `
      <header class="titlebar">
        <div class="window-title"><span>${app.icon}</span><span>${escapeHTML(app.title)}</span></div>
        <div class="window-controls">
          <button data-window="minimize" title="最小化" type="button">—</button>
          <button data-window="maximize" title="最大化" type="button">□</button>
          <button class="close" data-window="close" title="关闭" type="button">×</button>
        </div>
      </header>
      <div class="window-content">${contentFor(appName)}</div>`;

    document.body.appendChild(win);
    windows.set(appName, win);
    bindWindow(win);
    return win;
  }

  function openApp(appName, options = {}) {
    if (!apps[appName]) return;

    closePanels();
    let win = windows.get(appName);

    if (!win) {
      win = makeWindow(appName);
    } else {
      win.classList.remove("minimized");
      win.classList.add("show");
    }

    if (appName === "explorer" && options.folderId) {
      showFolder(win, options.folderId);
    } else if (appName === "notepad" && options.fileId) {
      loadTextFile(win, options.fileId);
    } else if (appName === "photos" && options.fileId) {
      loadPhoto(win, options.fileId);
    }

    focusWindow(win);
  }

  function closeApp(win) {
    const name = win.dataset.app;
    if (win._taskTimer) clearInterval(win._taskTimer);
    if (win._mediaStop) win._mediaStop();
    windows.delete(name);
    win.remove();
    updateTaskbar();
  }

  function toggleMaximize(win) {
    const wasMaximized = win.classList.toggle("maximized");
    if (!wasMaximized) {
      win.style.top = "80px";
      win.style.left = "50%";
      win.style.transform = "translateX(-50%)";
    }
  }

  function bindWindow(win) {
    const titlebar = $(".titlebar", win);
    let dragging = false;
    let dx = 0;
    let dy = 0;

    win.addEventListener("pointerdown", () => focusWindow(win));

    titlebar.addEventListener("pointerdown", event => {
      if (event.target.closest(".window-controls") || win.classList.contains("maximized")) return;
      dragging = true;
      const rect = win.getBoundingClientRect();
      dx = event.clientX - rect.left;
      dy = event.clientY - rect.top;
      win.style.left = rect.left + "px";
      win.style.top = rect.top + "px";
      win.style.transform = "none";
      titlebar.setPointerCapture(event.pointerId);
    });

    titlebar.addEventListener("pointermove", event => {
      if (!dragging) return;
      win.style.left = Math.max(0, event.clientX - dx) + "px";
      win.style.top = Math.max(0, event.clientY - dy) + "px";
    });

    titlebar.addEventListener("pointerup", () => dragging = false);
    titlebar.addEventListener("pointercancel", () => dragging = false);

    win.addEventListener("click", event => {
      const control = event.target.closest("[data-window]");
      if (control) {
        if (control.dataset.window === "close") closeApp(win);
        if (control.dataset.window === "minimize") {
          win.classList.add("minimized");
          updateTaskbar();
        }
        if (control.dataset.window === "maximize") toggleMaximize(win);
        return;
      }

      const appButton = event.target.closest("[data-open-app]");
      if (appButton) return openApp(appButton.dataset.openApp);

      const command = event.target.closest("[data-command]");
      if (command) return explorerCommand(win, command.dataset.command);

      const nav = event.target.closest("[data-location]");
      if (nav) return goLocation(win, nav.dataset.location);

      const fileItem = event.target.closest("[data-file-id]");
      if (fileItem) {
        $$(".file-item", win).forEach(item => item.classList.remove("selected"));
        fileItem.classList.add("selected");
        win.dataset.selectedFile = fileItem.dataset.fileId;
        if (event.detail === 2) openNode(fileItem.dataset.fileId);
        return;
      }

      const note = event.target.closest("[data-note]");
      if (note) return noteCommand(win, note.dataset.note);

      const calc = event.target.closest("[data-calc]");
      if (calc) return calculatorKey(win, calc.dataset.calc);

      const browser = event.target.closest("[data-browser]");
      if (browser) return browserCommand(win, browser.dataset.browser);

      const bookmark = event.target.closest("[data-browse-url]");
      if (bookmark) return browserNavigate(win, bookmark.dataset.browseUrl);

      const paint = event.target.closest("[data-paint]");
      if (paint) return paintCommand(win, paint.dataset.paint);

      const mineButton = event.target.closest("[data-mine]");
      if (mineButton) return mineInit(win);

      const taskAction = event.target.closest("[data-task]");
      if (taskAction) {
        if (taskAction.dataset.task === "refresh") taskmgrRender(win);
        if (taskAction.dataset.task === "end") taskmgrEnd(win);
        return;
      }

      const taskRow = event.target.closest("[data-task-app]");
      if (taskRow) {
        $$("[data-task-app]", win).forEach(row => row.classList.remove("selected"));
        taskRow.classList.add("selected");
        win.dataset.selectedTask = taskRow.dataset.taskApp;
        return;
      }

      const calendarButton = event.target.closest("[data-cal]");
      if (calendarButton) {
        win._calOffset = (win._calOffset || 0) + (calendarButton.dataset.cal === "next" ? 1 : -1);
        return calendarRender(win);
      }

      const mediaPlay = event.target.closest("[data-media-play]");
      if (mediaPlay) return mediaPlayTrack(win, Number(mediaPlay.dataset.mediaPlay));

      if (event.target.closest("[data-media-stop]")) {
        win._mediaStop?.();
        return;
      }

      const setting = event.target.closest("[data-setting]");
      if (setting) return toggleTheme();

      const wallpaper = event.target.closest("[data-wallpaper]");
      if (wallpaper) return setWallpaper(wallpaper.dataset.wallpaper);

      const trashAction = event.target.closest("[data-trash]");
      if (trashAction) {
        if (trashAction.dataset.trash === "empty") emptyTrash();
        if (trashAction.dataset.trash === "restore") restoreSelected(win);
      }
    });

    win.addEventListener("input", event => {
      if (event.target.matches("[data-filter]")) renderExplorer(win);

      if (event.target.matches(".notepad-text")) {
        const node = findNode(win.dataset.fileId);
        if (node) {
          node.content = event.target.value;
          save();
        }
      }
    });

    win.addEventListener("keydown", event => {
      if (event.target.matches("[data-url]") && event.key === "Enter") {
        browserNavigate(win, event.target.value);
      }

      if (event.target.matches(".term-input") && event.key === "Enter") {
        terminalRun(win, event.target.value);
      }
    });

    win.addEventListener("contextmenu", event => {
      const mineCell = event.target.closest("[data-mine-cell]");
      if (mineCell) {
        event.preventDefault();
        return mineFlag(win, Number(mineCell.dataset.mineCell));
      }

      const item = event.target.closest("[data-file-id]");
      if (item) {
        event.preventDefault();
        showContextMenu(event.clientX, event.clientY, {
          place: "explorer",
          nodeId: item.dataset.fileId,
          folderId: win.dataset.folderId || fs.id
        });
      }
    });

    if (win.dataset.app === "explorer") {
      win.dataset.folderId = fs.id;
      renderExplorer(win);
    }
    if (win.dataset.app === "trash") renderTrash(win);
    if (win.dataset.app === "browser") browserHome(win);
    if (win.dataset.app === "paint") paintInit(win);
    if (win.dataset.app === "minesweeper") mineInit(win);
    if (win.dataset.app === "calendar") calendarRender(win);
    if (win.dataset.app === "taskmgr") {
      taskmgrRender(win);
      win._taskTimer = setInterval(() => {
        if (win.isConnected && !win.classList.contains("minimized")) taskmgrRender(win, true);
      }, 3000);
    }
    if (win.dataset.app === "terminal") setTimeout(() => $(".term-input", win)?.focus(), 50);
  }

  function contentFor(name) {
    if (name === "explorer") {
      return `
        <div class="toolbar">
          <button class="tool" data-command="up" title="上一级" type="button">↑</button>
          <div class="address" data-address>📂 此电脑</div>
          <input class="address" data-filter placeholder="搜索当前文件夹">
          <button class="tool" data-command="new-folder" title="新建文件夹" type="button">📁＋</button>
          <button class="tool" data-command="new-file" title="新建文档" type="button">📄＋</button>
          <button class="tool" data-command="refresh" title="刷新" type="button">⟳</button>
        </div>
        <div class="explorer-layout">
          <aside class="sidebar">
            <div class="nav-item selected" data-location="root">📂 此电脑</div>
            <div class="nav-item" data-location="desktop">🖥️ 桌面</div>
            <div class="nav-item" data-location="documents">📄 文档</div>
            <div class="nav-item" data-location="downloads">📥 下载</div>
            <div class="nav-item" data-location="pictures">🖼️ 图片</div>
            <div class="nav-item" data-location="trash">🗑️ 回收站</div>
          </aside>
          <div class="files-area" data-files-area></div>
        </div>`;
    }

    if (name === "browser") {
      return `
        <div class="browser-wrap">
          <div class="toolbar">
            <button class="tool" data-browser="back" title="后退" type="button">←</button>
            <button class="tool" data-browser="forward" title="前进" type="button">→</button>
            <button class="tool" data-browser="reload" title="刷新" type="button">⟳</button>
            <button class="tool" data-browser="home" title="主页" type="button">🏠</button>
            <input class="address" data-url placeholder="输入网址，例如 example.com" spellcheck="false">
            <button class="tool" data-browser="go" type="button">前往</button>
            <button class="tool" data-browser="newtab" title="系统浏览器打开" type="button">↗</button>
          </div>
          <div class="browser-bookmarks">
            ${bookmarks.map(item => `
              <button class="bm-card" data-browse-url="${escapeHTML(item.url)}" type="button">
                <span class="bm-icon">${item.icon}</span><span class="bm-name">${escapeHTML(item.name)}</span>
              </button>`).join("")}
          </div>
          <iframe class="browser-frame" data-frame title="浏览器页面" referrerpolicy="no-referrer"></iframe>
          <div class="browser-tip">部分网站禁止嵌入；若页面空白，可点 ↗ 在系统浏览器打开。</div>
        </div>`;
    }

    if (name === "notepad") {
      return `
        <div class="notepad-wrap">
          <div class="notepad-menu">
            <button class="tool" data-note="new" type="button">新建</button>
            <button class="tool" data-note="save" type="button">保存</button>
            <span data-note-name>未命名.txt</span>
          </div>
          <textarea class="notepad-text" spellcheck="false" placeholder="在此处输入文字…"></textarea>
        </div>`;
    }

    if (name === "calculator") {
      const keys = ["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="];
      return `<div class="calc">
        <input class="calc-display" value="0" readonly>
        <div class="calc-grid">${keys.map(key =>
          `<button class="calc-key ${key === "=" ? "equals" : ""}" data-calc="${key}" type="button">${key}</button>`
        ).join("")}</div>
      </div>`;
    }

    if (name === "paint") {
      return `<div class="paint-wrap">
        <div class="toolbar paint-controls">
          <button class="tool" data-paint="save" type="button">💾 保存到桌面</button>
          <button class="tool" data-paint="clear" type="button">🗑 清空</button>
          <label>
