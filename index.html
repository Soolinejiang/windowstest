<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows Web Pro</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="desktop" class="desktop" aria-label="桌面"></main>

    <section class="panel start-menu" id="startMenu" aria-label="开始菜单">
      <input
        class="start-search"
        id="startSearch"
        placeholder="Search apps..."
        autocomplete="off"
      />
      <div class="heading">
        <span>应用</span>
        <button id="allAppsBtn" type="button">All apps</button>
      </div>
      <div id="appGrid" class="app-grid"></div>
    </section>

    <section class="panel notifications" id="notifications" aria-label="通知列表">
      <div class="heading">
        <span>通知</span>
        <button id="clearNotifications" type="button">清空</button>
      </div>
      <div id="notificationCard" class="notification-card">
        Windows Web Pro 已启动<br />
        欢迎使用桌面系统。
      </div>
    </section>

    <div id="contextMenu" class="context-menu"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <footer class="taskbar">
      <div class="taskbar-center">
        <button class="task-button" id="startButton" title="开始" type="button">🪟</button>

        <label class="task-search" aria-label="应用搜索">
          <input id="taskSearchInput" placeholder="Search..." />
        </label>

        <div id="taskButtons" class="task-buttons"></div>
      </div>

      <div class="tray">
        <button id="quickButton" title="通知" type="button">🔔</button>
        <button id="clockButton" title="时钟" type="button">
          <div id="clockTime">00:00</div>
          <div id="clockDate">2026/11/08</div>
        </button>
      </div>
    </footer>

    <script src="./data.js"></script>
    <script src="./filesystem.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
